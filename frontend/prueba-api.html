<!doctype html>
<!--
  PÁGINA DE PRUEBA DEL BACKEND.
  Solo sirve para comprobar que la API responde, sin el widget. La interfaz
  del chat está en frontend/widget/ y se ve en index.html.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba de API - Chatbot Asuntos Estudiantiles</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-bottom: .25rem; font-weight: 600; }
    textarea { width: 100%; min-height: 4rem; }
    pre { white-space: pre-wrap; background: #f4f4f4; padding: 1rem; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Prueba de API</h1>
  <p>Página para verificar el backend. Estado: <span id="estado">consultando…</span></p>
  <label for="pregunta">Pregunta</label>
  <textarea id="pregunta" placeholder="Ej.: ¿Cuándo se reúne el comité?"></textarea>
  <button id="enviar">Preguntar</button>
  <pre id="salida"></pre>

  <script type="module">
    const salida = document.getElementById("salida");
    const estado = document.getElementById("estado");

    document.getElementById("enviar").addEventListener("click", async () => {
      const pregunta = document.getElementById("pregunta").value.trim();
      if (!pregunta) return;
      salida.textContent = "Consultando…";
      try {
        const r = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pregunta }),
        });
        const d = await r.json();
        salida.textContent = r.ok
          ? d.respuesta + "\n\nFuentes:\n" + d.fuentes.map(f => `- ${f.titulo}: ${f.url}`).join("\n")
          : "Error: " + JSON.stringify(d.detail);
      } catch (error) {
        console.error(error);
        salida.textContent = "No se pudo conectar con el servidor.";
      }
    });

    // Estado del sistema al cargar la página.
    try {
      const d = await (await fetch("/api/health")).json();
      estado.textContent =
        `BD: ${d.base_datos} · fragmentos: ${d.fragmentos_indexados} · LLM: ${d.proveedor_llm}`;
    } catch (error) {
      console.error(error);
      estado.textContent = "sin conexión";
    }
  </script>
</body>
</html>
